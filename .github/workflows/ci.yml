name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: typecheck, lint, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux for speed, Windows because half the team develops on it.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:hooks
      - run: pnpm format:check

  gitleaks:
    name: secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # On PRs the action lists the PR's commits through the API to scan only those.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  openapi-diff:
    name: OpenAPI diff
    runs-on: ubuntu-latest
    steps:
      # Placeholder until the API generates its OpenAPI document from zod (#4). It will then fail a PR
      # that changes the public API without the `contract-change` label.
      - run: echo "OpenAPI diff not wired up yet"
