name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: typecheck, lint, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux for speed, Windows because half the team develops on it.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:hooks
      - run: pnpm format:check

  database:
    name: database (Postgres 18)
    runs-on: ubuntu-latest
    # Migrations and the row-level security tests against a real, throwaway Postgres (#7). The
    # matrix job skips them: Windows runners can't run service containers.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      # A local, disposable CI database: not a secret.
      KEEPWELL_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Turn a skipped database test into a failure here: a green job must mean the tests ran.
      KEEPWELL_REQUIRE_DATABASE_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test --filter=@keepwell/db --filter=@keepwell/api

  gitleaks:
    name: secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # On PRs the action lists the PR's commits through the API to scan only those.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  openapi-diff:
    name: OpenAPI diff
    runs-on: ubuntu-latest
    steps:
      # Placeholder until the API generates its OpenAPI document from zod (#4). It will then fail a PR
      # that changes the public API without the `contract-change` label.
      - run: echo "OpenAPI diff not wired up yet"
