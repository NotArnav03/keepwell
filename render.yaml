# Render Blueprint for the staging API. Arnav (M1) applies it by hand in the Render dashboard.
# Secrets use `sync: false`, so Render asks for them; they never live in this file.
# Free plan (the project runs on ₹0): it sleeps after 15 idle minutes and wakes on the next request
# in under a minute. Staging is allowed to sleep; see ARCHITECTURE.md §4 for keeping prod-demo awake.
services:
  - type: web
    name: keepwell-api-staging
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@keepwell/api
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: LOG_LEVEL
        value: info
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      # Neon `staging` branch, DIRECT connection string (host without -pooler).
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # No PAYPAL_WEBHOOK_ID: `pnpm seed` registers the webhook and stores its id on the merchant.
      # Read by the agent once it's wired in; blank until then.
      - key: ANTHROPIC_API_KEY
        sync: false
      # The whole AI budget is a $5 prepaid credit that must last until judging ends (21 Dec).
      - key: LLM_DAILY_BUDGET_USD
        value: "0.10"
      # The service's own URL: PayPal sends buyers back here after a revise.
      - key: API_PUBLIC_URL
        value: https://keepwell-api-staging.onrender.com
      # Two proxies sit in front of the service: Render's edge, then an internal one (10.x). Checked
      # on staging 3 Nov: with 1, request.ip was the internal proxy's 10.x address.
      - key: TRUST_PROXY_HOPS
        value: "2"
      - key: OPS_TOKEN
        sync: false
      # Email (modules/notify, #91). Signs unsubscribe links: 32+ random characters, and it must be
      # set, because this plan restarts on every wake and an unset secret gets a new random key each
      # time, which breaks every link already sent.
      - key: UNSUBSCRIBE_TOKEN_SECRET
        sync: false
      # Leave blank on staging: sandbox buyers' addresses (sb-...@personal.example.com) can't receive
      # mail, so real sends would only bounce. Messages still show in the Demo Inbox.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SENTRY_DSN
        sync: false
