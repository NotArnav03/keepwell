# Render Blueprint for staging and prod-demo: the API and the merchant dashboard for each.
# Arnav (M1) applies it by hand.
# Secrets use `sync: false`, so Render asks for them; they never live in this file.
# Free plan (the project runs on ₹0): it sleeps after 15 idle minutes and wakes on the next request
# in under a minute. Staging is allowed to sleep; see ARCHITECTURE.md §4 for keeping prod-demo awake.
services:
  - type: web
    name: keepwell-api-staging
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@keepwell/api
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: LOG_LEVEL
        value: info
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      # Neon `staging` branch, DIRECT connection string (host without -pooler).
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # No PAYPAL_WEBHOOK_ID: `pnpm seed` registers the webhook and stores its id on the merchant.
      # Read by the agent once it's wired in; blank until then.
      - key: ANTHROPIC_API_KEY
        sync: false
      # The whole AI budget is a $5 prepaid credit that must last until judging ends (21 Dec).
      - key: LLM_DAILY_BUDGET_USD
        value: "0.10"
      # The service's own URL: PayPal sends buyers back here after a revise.
      - key: API_PUBLIC_URL
        value: https://keepwell-api-staging.onrender.com
      # The portal's origin: emailed sign-in links, and the help and reactivate links in M5's emails.
      - key: PORTAL_URL
        value: https://keepwell-portal-staging.onrender.com
      # Three proxies sit in front of the service (seen with /ops/whoami on 3 Nov): Cloudflare, then
      # Render's edge, then an internal 10.x proxy, and the socket itself is a proxy at 127.0.0.1.
      # X-Forwarded-For arrives as "<anything the client sent>, <client>, <cloudflare>, <10.x>", so
      # the client is 3 hops back. Re-check with /ops/whoami if Render changes its setup: too few hops
      # shares one rate limit, too many lets a client pick its own address.
      - key: TRUST_PROXY_HOPS
        value: "3"
      - key: OPS_TOKEN
        sync: false
      # Email (modules/notify, #91). Signs unsubscribe links: 32+ random characters, and it must be
      # set, because this plan restarts on every wake and an unset secret gets a new random key each
      # time, which breaks every link already sent.
      - key: UNSUBSCRIBE_TOKEN_SECRET
        sync: false
      # Leave blank on staging: sandbox buyers' addresses (sb-...@personal.example.com) can't receive
      # mail, so real sends would only bounce. Messages still show in the Demo Inbox.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Subscriber surfaces (M3, modules/surfaces.ts). Each part mounts only with its secrets, so these
      # can be set one at a time. Secrets: 32+ random characters, generated by a person, never reused.
      - key: SESSION_TICKET_SECRET
        sync: false
      - key: WIDGET_TOKEN_SECRET
        sync: false
      - key: JUDGE_LEASE_SECRET
        sync: false
      - key: MAGIC_LINK_SECRET
        sync: false
      # The seeded demo merchant's id in this environment's database.
      - key: DEMO_MERCHANT_ID
        sync: false
      # Origins that call /v1/sessions directly (the demo store); comma-separated.
      - key: WIDGET_ALLOWED_ORIGINS
        sync: false

  # The merchant dashboard (apps/dashboard, M4) as a free static site on Render's CDN. /v1/* is
  # rewritten to the staging API, so the browser sees one origin: the session cookie stays
  # first-party (SameSite=Lax) and needs no CORS. Two *.onrender.com hosts would be different sites,
  # since onrender.com is a public suffix, and Safari blocks such cookies.
  # Until #124 lands, apps/dashboard builds no index.html, so the site itself shows a 404.
  - type: web
    name: keepwell-dashboard-staging
    runtime: static
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@keepwell/dashboard
    staticPublishPath: apps/dashboard/dist
    # Build only when the dashboard or a package it imports changes (the free plan's build minutes).
    buildFilter:
      paths:
        - apps/dashboard/**
        - packages/contracts/**
        - packages/policy/**
        - packages/ui/**
        - pnpm-lock.yaml
    envVars:
      - key: NODE_VERSION
        value: "24"
    routes:
      # First match wins: the API before the single-page-app fallback.
      - type: rewrite
        source: /v1/*
        destination: https://keepwell-api-staging.onrender.com/v1/*
      # For checking TRUST_PROXY_HOPS through the rewrite (behind OPS_TOKEN, as on the API).
      - type: rewrite
        source: /ops/whoami
        destination: https://keepwell-api-staging.onrender.com/ops/whoami
      - type: rewrite
        source: /*
        destination: /index.html

  # The hosted subscriber portal (apps/portal, M3, #138): magic-link sign-in, the widget full-page,
  # delegation tokens. Same one-origin trick as the dashboard: /v1/* is rewritten to the API so the
  # portal session cookie stays first-party. API_PUBLIC_URL is read at build time for the page's
  # data-api-origin (the widget checks PayPal's return message against it). The sign-in routes
  # answer once the portal is wired into platform.ts (see docs/HANDOFF-M1.md §5); until then they 404.
  - type: web
    name: keepwell-portal-staging
    runtime: static
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@keepwell/portal
    staticPublishPath: apps/portal/dist
    # Build only when the portal or a package it bundles changes (the free plan's build minutes).
    buildFilter:
      paths:
        - apps/portal/**
        - packages/widget/**
        - packages/contracts/**
        - pnpm-lock.yaml
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: API_PUBLIC_URL
        value: https://keepwell-api-staging.onrender.com
      - key: PORTAL_MERCHANT_SLUG
        value: pantry-plan
    routes:
      - type: rewrite
        source: /v1/*
        destination: https://keepwell-api-staging.onrender.com/v1/*
      - type: rewrite
        source: /*
        destination: /index.html

  # ── prod-demo: what judges use (ARCHITECTURE.md §4, docs/RUNBOOK-prod-demo.md) ──────────────────
  # The same build as staging, but deployed only by hand: auto-deploy is off, and Arnav deploys
  # the tagged commit with "Manual Deploy → Deploy a specific commit". Its database is a separate
  # Neon project (keepwell-prod-demo), so dev branches can't use up its free compute hours, and its
  # PayPal credentials are the sandbox app "Keepwell-Demo", never the staging app's.
  - type: web
    name: keepwell-api-demo
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: "off"
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@keepwell/api
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: prod-demo
      - key: LOG_LEVEL
        value: info
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      # Neon project keepwell-prod-demo, DIRECT connection string (host without -pooler).
      - key: DATABASE_URL_UNPOOLED
        sync: false
      # Sandbox app "Keepwell-Demo".
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Shares the $5 credit with staging. From 1 Dec, staging's cap drops so judging gets the rest.
      - key: LLM_DAILY_BUDGET_USD
        value: "0.10"
      # If Render gives the service a different hostname, change this and the dashboard rewrites.
      - key: API_PUBLIC_URL
        value: https://keepwell-api-demo.onrender.com
      # The portal's origin: emailed sign-in links, and the help and reactivate links in M5's emails.
      - key: PORTAL_URL
        value: https://keepwell-portal-demo.onrender.com
      # Same proxy chain as staging; check with /ops/whoami after the first deploy.
      - key: TRUST_PROXY_HOPS
        value: "3"
      # Generate each secret fresh for prod-demo; never reuse staging's.
      - key: OPS_TOKEN
        sync: false
      - key: UNSUBSCRIBE_TOKEN_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Subscriber surfaces (M3, modules/surfaces.ts). Each part mounts only with its secrets, so these
      # can be set one at a time. Secrets: 32+ random characters, generated by a person, never reused.
      - key: SESSION_TICKET_SECRET
        sync: false
      - key: WIDGET_TOKEN_SECRET
        sync: false
      - key: JUDGE_LEASE_SECRET
        sync: false
      - key: MAGIC_LINK_SECRET
        sync: false
      # The seeded demo merchant's id in this environment's database.
      - key: DEMO_MERCHANT_ID
        sync: false
      # Origins that call /v1/sessions directly (the demo store); comma-separated.
      - key: WIDGET_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: keepwell-dashboard-demo
    runtime: static
    branch: main
    autoDeployTrigger: "off"
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@keepwell/dashboard
    staticPublishPath: apps/dashboard/dist
    envVars:
      - key: NODE_VERSION
        value: "24"
    routes:
      - type: rewrite
        source: /v1/*
        destination: https://keepwell-api-demo.onrender.com/v1/*
      - type: rewrite
        source: /ops/whoami
        destination: https://keepwell-api-demo.onrender.com/ops/whoami
      - type: rewrite
        source: /*
        destination: /index.html

  # The hosted subscriber portal (apps/portal, M3, #138): magic-link sign-in, the widget full-page,
  # delegation tokens. Same one-origin trick as the dashboard: /v1/* is rewritten to the API so the
  # portal session cookie stays first-party. API_PUBLIC_URL is read at build time for the page's
  # data-api-origin (the widget checks PayPal's return message against it). The sign-in routes
  # answer once the portal is wired into platform.ts (see docs/HANDOFF-M1.md §5); until then they 404.
  - type: web
    name: keepwell-portal-demo
    runtime: static
    branch: main
    autoDeployTrigger: "off"
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@keepwell/portal
    staticPublishPath: apps/portal/dist
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: API_PUBLIC_URL
        value: https://keepwell-api-demo.onrender.com
      - key: PORTAL_MERCHANT_SLUG
        value: pantry-plan
    routes:
      - type: rewrite
        source: /v1/*
        destination: https://keepwell-api-demo.onrender.com/v1/*
      - type: rewrite
        source: /*
        destination: /index.html
