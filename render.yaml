# Render Blueprint for the staging API. Arnav (M1) applies it by hand in the Render dashboard.
# Secrets use `sync: false`, so Render asks for them; they never live in this file.
# Free plan (the project runs on ₹0): it sleeps after 15 idle minutes and wakes on the next request
# in under a minute. Staging is allowed to sleep; see ARCHITECTURE.md §4 for keeping prod-demo awake.
services:
  - type: web
    name: keepwell-api-staging
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@keepwell/api
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: LOG_LEVEL
        value: info
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      # Neon `staging` branch, DIRECT connection string (host without -pooler).
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # The whole AI budget is a  prepaid credit that must last until judging ends (21 Dec).
      - key: LLM_DAILY_BUDGET_USD
        value: "0.10"
